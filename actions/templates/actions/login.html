{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal MAGES – Login</title>
<link rel="stylesheet" href="{% static 'actions/css/login.css' %}">
</head>
<body>

  <section class="painel">
    <div class="painel-conteudo">
      <div class="logo">
        <img src="{% static 'actions/images/logo-mages.png' %}" alt="Logo Portal MAGES">
      </div>
      <h1>PORTAL MAGES</h1>
      <p class="texto">Acompanhe as ações de governança da sua prefeitura em um só lugar.</p>
    </div>
  </section>

  <main class="lado-form">
    <div class="card">

      <div class="titulo">
        <h2>Autenticação</h2>
        <p>Entre com seu CPF e senha.</p>
      </div>

      <form action="{% url 'login' %}" method="post" novalidate>
        {% csrf_token %}
        <div class="campos">

          <div class="campo">
            <label for="contrato">CPF</label>
            <input id="contrato" name="contrato" type="text" placeholder="Digite seu CPF (somente números)" 
                   pattern="[0-9]{11}" 
                   title="Digite um CPF válido com 11 dígitos numéricos."
            inputmode="numeric" maxlength="14" 
                   autocomplete="username" required
                   value="{{ contrato_digitado }}"
                   {% if erro_login %}class="invalido" aria-invalid="true"{% endif %}>
            <p class="erro-campo" id="erro-contrato" hidden></p>
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha"
                   autocomplete="current-password" required
                   {% if erro_login %}class="invalido" aria-invalid="true"{% endif %}>
            <p class="erro-campo" id="erro-senha" {% if not erro_login %}hidden{% endif %}>CPF ou senha inválidos.</p>
            <a class="esqueci" href="#">Esqueci minha senha</a>
          </div>
        </div>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </main>
  <script src="{% static 'actions/js/login.js' %}"></script>
</body>
</html>
