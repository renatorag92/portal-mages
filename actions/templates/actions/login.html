{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'actions/css/login.css' %}">
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <main class="login-card p-4 p-md-5 shadow-sm text-center">
        <!-- Logo -->
        <div class="mb-4">
            <img src="{% static 'actions/images/portal-mages.png' %}" alt="Portal Mages" class="img-fluid" style="max-width: 300px;">
        </div>

        <!-- Título -->
        <h2 class="h5 fw-bold text-dark mb-4">Autenticação</h2>

        <!-- Formulário -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3 text-start">
                <label for="username" class="form-label label-custom">Nº do contrato</label>
                <input type="text" name="username" id="username" class="form-control form-control-custom" required autocomplete="off">
            </div>

            <div class="mb-4 text-start">
                <label for="password" class="form-label label-custom">Senha</label>
                <input type="password" name="password" id="password" class="form-control form-control-custom" required>
            </div>

            <button type="submit" class="btn btn-custom mx-auto d-block">Entrar</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
