{# Card de uma ação no Kanban. Os detalhes abrem no pop-up (kanban-detalhes.js). #}
<div class="task-card {% if status.nome|slugify == 'cancelado' %}highlight{% endif %}"
  draggable="{% if status.nome|slugify == 'cancelado' %}false{% else %}true{% endif %}"
  data-codigo="{{ acao.codigo }}"
  data-eixo="{{ acao.acao_catalogo.eixo.nome }}" data-search="{{ acao.codigo }} {{ acao.acao_catalogo.nome }}">

  <!-- BOTÃO QUE ABRE O POP-UP DE DETALHES -->
  <button type="button" class="status-menu-toggle" aria-label="Ver detalhes da ação {{ acao.codigo }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <!-- IDENTIFICAÇÃO -->
  <span class="task-id">AÇÃO {{ acao.codigo }}</span>

  <!-- NOME -->
  <div class="task-desc">{{ acao.acao_catalogo.nome }}</div>

  <!-- ANDAMENTO DAS ETAPAS (escondido quando a ação não tem etapas).
       O kanban-detalhes.js atualiza este bloco ao marcar, adicionar ou excluir etapas. -->
  <div class="task-progress{% if acao.total_etapas and acao.etapas_concluidas == acao.total_etapas %} completo{% endif %}"
    style="--andamento: {% widthratio acao.etapas_concluidas acao.total_etapas 100 %};"
    {% if not acao.total_etapas %}hidden{% endif %}>
    <div class="task-progress-barra"><div class="task-progress-preenchido"></div></div>
    <span class="task-progress-texto">{{ acao.etapas_concluidas }}/{{ acao.total_etapas }}</span>
    <i class="bi bi-check-circle-fill task-progress-check" title="Todas as etapas concluídas"></i>
  </div>

  {% if status.nome|slugify != 'cancelado' %}
  <!-- FORMULÁRIO DE STATUS (usado pelo arrastar e pelos botões do pop-up) -->
  <form action="{% url 'atualizar_status_acao' acao.codigo %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="status" value="{{ status.id }}">
  </form>
  {% endif %}

</div>
