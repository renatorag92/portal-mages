{# Card de uma ação no Kanban. Os detalhes abrem no pop-up (kanban-detalhes.js). #}
<div class="task-card {% if status.nome|slugify == 'cancelado' %}highlight{% endif %}"
  draggable="{% if status.nome|slugify == 'cancelado' %}false{% else %}true{% endif %}"
  data-codigo="{{ acao.codigo }}"
  data-eixo="{{ acao.acao_catalogo.eixo.nome }}" data-search="{{ acao.codigo }} {{ acao.acao_catalogo.nome }}">

  <!-- BOTÃO QUE ABRE O POP-UP DE DETALHES -->
  <button type="button" class="status-menu-toggle" aria-label="Ver detalhes da ação {{ acao.codigo }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <!-- IDENTIFICAÇÃO -->
  <span class="task-id">AÇÃO {{ acao.codigo }}</span>

  <!-- NOME -->
  <div class="task-desc">{{ acao.acao_catalogo.nome }}</div>

  {% if status.nome|slugify != 'cancelado' %}
  <!-- FORMULÁRIO DE STATUS (usado pelo arrastar e pelos botões do pop-up) -->
  <form action="{% url 'atualizar_status_acao' acao.codigo %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="status" value="{{ status.id }}">
  </form>
  {% endif %}

</div>
