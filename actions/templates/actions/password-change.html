{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinição de Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'actions/css/login.css' %}">
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <main class="login-card p-4 p-md-5 shadow-sm text-center">
        <!-- Logo -->
        <div class="mb-4">
            <img src="{% static 'actions/images/portal-mages.png' %}" alt="Portal Mages" class="img-fluid"
                style="max-width: 300px;">
        </div>

        <!-- Título -->
        <h2 class="h5 fw-bold text-dark mb-4">Redefinição de Senha</h2>

        <!-- Formulário -->
        <form method="POST">
            {% csrf_token %}

            <!-- O Django gera os 3 campos (Senha Atual, Nova Senha e Confirmação) -->
            {% for field in form %}
            <div class="mb-3 text-start">
                <label for="{{ field.id_for_label }}" class="form-label label-custom">
                    {{ field.label }}
                </label>

                {{ field }} 

                <!-- Mostra mensagens de erro de validação (ex: senhas não coincidem) -->
                {% if field.errors %}
                <div class="text-danger small mt-1">
                    {{ field.errors.0 }}
                </div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn btn-custom mx-auto d-block">Atualizar Senha</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
