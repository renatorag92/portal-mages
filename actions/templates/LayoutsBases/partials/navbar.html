{% load static %}

<div class="topbar">
  <!-- ===================================================== -->
  <!-- LADO ESQUERDO -->
  <!-- ===================================================== -->

  <div class="topbar-left">
    <img src="{% static 'actions/images/portal-mages.png' %}" alt="Logo MAGES" class="navbar-logo" />

    <h1 id="page-title"></h1>
  </div>

  <!-- ===================================================== -->
  <!-- ÍCONES -->
  <!-- ===================================================== -->

  <div class="topbar-icons">
    <!-- ================================================= -->
    <!-- NOTIFICAÇÕES -->
    <!-- ================================================= -->

    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />

      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>

    <!-- ================================================= -->
    <!-- CONFIGURAÇÕES -->
    <!-- ================================================= -->

    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3" />

      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
    </svg>

    <!-- ================================================= -->
    <!-- AVATAR -->
    <!-- ================================================= -->

    <div class="avatar-wrapper" id="avatarWrapper">
      <div class="avatar" id="avatarToggle">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4" />

          <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" />
        </svg>
      </div>

      <!-- ================================================= -->
      <!-- MENU DO AVATAR -->
      <!-- ================================================= -->

      <div class="avatar-menu" id="avatarMenu">
        <button type="button" class="avatar-menu-item">Minha Conta</button>

        <button type="button" class="avatar-menu-item">Segurança</button>

        <button type="button" class="avatar-menu-item">Ajuda</button>

        <!-- ============================================= -->
        <!-- LOGOUT -->
        <!-- ============================================= -->

        <form action="{% url 'logout' %}" method="post" style="display: inline;">
          {% csrf_token %}

          <button type="submit" class="avatar-menu-item avatar-menu-item-danger">Sair</button>
        </form>
      </div>
    </div>
  </div>
</div>
